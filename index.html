<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPSC Tracker</title>
  <style>
    :root{
      --bg:#f7f8fa; --card:#fff; --text:#111827; --muted:#6b7280; --border:#e5e7eb;
      --accent:#4f46e5; --ok:#16a34a; --warn:#d97706; --err:#dc2626;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
    aside{background:var(--card);border-right:1px solid var(--border);padding:14px}
    .brand{font-weight:700;margin-bottom:12px}
    .nav-btn{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 10px;border:1px solid var(--border);background:#fff;border-radius:8px;cursor:pointer}
    .nav-btn.active{border-color:var(--accent);color:var(--accent)}
    main{padding:16px}
    .page{display:none}
    .page.active{display:block}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    input,textarea,select,button{
      border:1px solid var(--border);border-radius:8px;padding:8px 10px;font:inherit;background:#fff;color:var(--text)
    }
    textarea{width:100%;min-height:120px}
    .small{font-size:12px;color:var(--muted)}
    .subject{border:1px solid var(--border);border-radius:10px;margin-top:8px;overflow:hidden;background:#fff}
    .subject-head{padding:8px 10px;background:#f9fafb;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between}
    .topic,.sub{padding:6px 10px}
    .sub{padding-left:28px;color:#374151}
    .task{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:8px;margin-top:6px}
    .pill{font-size:11px;border:1px solid var(--border);padding:2px 8px;border-radius:999px}
    .right{margin-left:auto}
    #debug{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;font-size:12px;line-height:1.35}
    .ok{color:var(--ok)} .warn{color:var(--warn)} .err{color:var(--err)}
    @media (max-width:860px){.app{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">UPSC Tracker</div>
    <button class="nav-btn active" data-page="dashboard">Dashboard</button>
    <button class="nav-btn" data-page="syllabus">Syllabus</button>
    <button class="nav-btn" data-page="plan">Study Plan</button>
    <button class="nav-btn" data-page="settings">Settings</button>
    <p class="small">Designed to efficiently track UPSC CSE syllabus.</p>
  </aside>

  <main>
    <section id="dashboard" class="page active">
      <div class="card">
        <h3>Dashboard</h3>
        <div>Completion: <strong id="pct">0%</strong></div>
        <div>Done/Total: <strong id="done">0</strong>/<strong id="total">0</strong></div>
        <div>Plan: <strong id="planDone">0</strong>/<strong id="planTotal">0</strong></div>
      </div>
      <div class="card">
        <h4>Debug Console</h4>
        <div id="debug"></div>
      </div>
    </section>

    <section id="syllabus" class="page">
      <div class="card">
        <h3>Syllabus Parser (.md + pasted text only)</h3>
        <div class="row">
          <input type="file" id="fileInput" accept=".md,text/markdown" />
          <button id="loadFileBtn">Load .md</button>
          <button id="parseTextBtn">Parse Text</button>
          <input id="searchInput" placeholder="Search..." />
          <button id="expandBtn">Expand</button>
          <button id="collapseBtn">Collapse</button>
        </div>
        <textarea id="syllabusText" placeholder="# Subject&#10;## Topic&#10;- Subtopic"></textarea>
        <p class="small">No preloaded syllabus.</p>
      </div>
      <div id="syllabusBox"></div>
    </section>

    <section id="plan" class="page">
      <div class="card">
        <h3>Study Plan</h3>
        <div class="row">
          <input id="taskText" placeholder="Task text..." />
          <select id="taskType"><option>Daily</option><option>Weekly</option></select>
          <button id="addTaskBtn">Add Task</button>
        </div>
        <div id="taskList"></div>
      </div>
    </section>

    <section id="settings" class="page">
      <div class="card">
        <h3>Settings</h3>
        <div class="row">
          <button id="resetProgressBtn">Reset Progress</button>
          <button id="resetPlanBtn">Reset Plan</button>
          <button id="resetAllBtn">Reset All</button>
          <button id="exportBtn">Export JSON</button>
          <input type="file" id="importInput" accept=".json,application/json" />
          <button id="importBtn">Import JSON</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  "use strict";

  const KEY = "upscTrackerDebugState";
  const $ = (id) => document.getElementById(id);
  const logEl = () => $("debug");
  function log(msg, type="ok"){
    const el = logEl();
    if(!el) return;
    const line = document.createElement("div");
    line.className = type;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    el.appendChild(line);
  }

  window.addEventListener("error", (e) => {
    log(`ERROR: ${e.message} @ ${e.filename}:${e.lineno}`, "err");
  });

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function defaultState(){
    return {
      syllabus: [],
      plan: [
        { id: uid(), text: "Daily revision", type: "Daily", done: false },
        { id: uid(), text: "Weekly mock test", type: "Weekly", done: false }
      ]
    };
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return defaultState();
      const parsed = JSON.parse(raw);
      if(!parsed || !Array.isArray(parsed.syllabus) || !Array.isArray(parsed.plan)) return defaultState();
      return parsed;
    }catch{
      return defaultState();
    }
  }

  let state = loadState();

  function saveState(){
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function parseMarkdown(text){
    const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    const subjects = [];
    let currentSubject = null;
    let currentTopic = null;

    for(const line of lines){
      if(line.startsWith("# ")){
        currentSubject = { id: uid(), name: line.slice(2), expanded: true, topics: [] };
        subjects.push(currentSubject);
        currentTopic = null;
      } else if(line.startsWith("## ")){
        if(!currentSubject){
          currentSubject = { id: uid(), name: "General", expanded: true, topics: [] };
          subjects.push(currentSubject);
        }
        currentTopic = { id: uid(), name: line.slice(3), done: false, subtopics: [] };
        currentSubject.topics.push(currentTopic);
      } else if(line.startsWith("- ")){
        if(!currentSubject){
          currentSubject = { id: uid(), name: "General", expanded: true, topics: [] };
          subjects.push(currentSubject);
        }
        if(!currentTopic){
          currentTopic = { id: uid(), name: "Main", done: false, subtopics: [] };
          currentSubject.topics.push(currentTopic);
        }
        currentTopic.subtopics.push({ id: uid(), name: line.slice(2), done: false });
      } else {
        // Plain text fallback -> topic
        if(!currentSubject){
          currentSubject = { id: uid(), name: "General", expanded: true, topics: [] };
          subjects.push(currentSubject);
        }
        currentTopic = { id: uid(), name: line, done: false, subtopics: [] };
        currentSubject.topics.push(currentTopic);
      }
    }
    return subjects;
  }

  function toggleTopic(topicId, checked){
    state.syllabus.forEach(s => s.topics.forEach(t => {
      if(t.id === topicId){
        t.done = checked;
        t.subtopics.forEach(st => st.done = checked);
      }
    }));
  }

  function toggleSub(topicId, subId, checked){
    state.syllabus.forEach(s => s.topics.forEach(t => {
      if(t.id === topicId){
        const sub = t.subtopics.find(x => x.id === subId);
        if(sub) sub.done = checked;
        t.done = t.subtopics.length ? t.subtopics.every(x => x.done) : t.done;
      }
    }));
  }

  function metrics(){
    let total=0, done=0;
    state.syllabus.forEach(s => s.topics.forEach(t => {
      total++; if(t.done) done++;
      t.subtopics.forEach(st => { total++; if(st.done) done++; });
    }));
    return { total, done, pct: total ? Math.round(done*100/total) : 0 };
  }

  function renderNav(){
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
        const page = $(btn.dataset.page);
        if(page) page.classList.add("active");
      };
    });
  }

  function renderSyllabus(){
    const box = $("syllabusBox");
    if(!box) return;
    box.innerHTML = "";
    const q = ($("searchInput")?.value || "").toLowerCase().trim();

    if(state.syllabus.length === 0){
      box.innerHTML = `<div class="card"><div class="small">No syllabus loaded.</div></div>`;
      return;
    }

    state.syllabus.forEach(subject => {
      const sDiv = document.createElement("div");
      sDiv.className = "subject";

      const head = document.createElement("div");
      head.className = "subject-head";
      head.innerHTML = `<strong>${subject.name}</strong><span class="small">${subject.expanded ? "−" : "+"}</span>`;
      head.onclick = () => { subject.expanded = !subject.expanded; saveState(); renderSyllabus(); };
      sDiv.appendChild(head);

      const body = document.createElement("div");
      body.style.display = subject.expanded ? "block" : "none";

      subject.topics.forEach(topic => {
        const tm = topic.name.toLowerCase().includes(q);
        const sm = topic.subtopics.some(x=>x.name.toLowerCase().includes(q));
        const smj = subject.name.toLowerCase().includes(q);
        if(q && !(tm || sm || smj)) return;

        const t = document.createElement("div");
        t.className = "topic";
        t.innerHTML = `<label><input type="checkbox" ${topic.done?"checked":""} data-tid="${topic.id}" data-kind="topic"> ${topic.name}</label>`;
        body.appendChild(t);

        topic.subtopics.forEach(sub => {
          if(q && !(smj || tm || sub.name.toLowerCase().includes(q))) return;
          const st = document.createElement("div");
          st.className = "sub";
          st.innerHTML = `<label><input type="checkbox" ${sub.done?"checked":""} data-tid="${topic.id}" data-sid="${sub.id}" data-kind="sub"> ${sub.name}</label>`;
          body.appendChild(st);
        });
      });

      sDiv.appendChild(body);
      box.appendChild(sDiv);
    });

    box.querySelectorAll("input[type='checkbox']").forEach(cb => {
      cb.onchange = (e) => {
        const kind = e.target.dataset.kind;
        if(kind === "topic") toggleTopic(e.target.dataset.tid, e.target.checked);
        else toggleSub(e.target.dataset.tid, e.target.dataset.sid, e.target.checked);
        saveState();
        renderAll();
      };
    });
  }

  function renderPlan(){
    const list = $("taskList");
    if(!list) return;
    list.innerHTML = "";

    state.plan.forEach(task => {
      const row = document.createElement("div");
      row.className = "task";
      row.innerHTML = `
        <input type="checkbox" ${task.done ? "checked" : ""} data-id="${task.id}">
        <span>${task.text}</span>
        <span class="pill">${task.type}</span>
        <button class="right" data-del="${task.id}">Delete</button>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll("input[type='checkbox']").forEach(cb => {
      cb.onchange = (e) => {
        const t = state.plan.find(x=>x.id===e.target.dataset.id);
        if(t){ t.done = e.target.checked; saveState(); renderDashboard(); }
      };
    });

    list.querySelectorAll("button[data-del]").forEach(btn => {
      btn.onclick = () => {
        state.plan = state.plan.filter(x=>x.id!==btn.dataset.del);
        saveState();
        renderPlan();
        renderDashboard();
      };
    });
  }

  function renderDashboard(){
    const m = metrics();
    if($("pct")) $("pct").textContent = `${m.pct}%`;
    if($("done")) $("done").textContent = String(m.done);
    if($("total")) $("total").textContent = String(m.total);

    const planDone = state.plan.filter(x=>x.done).length;
    if($("planDone")) $("planDone").textContent = String(planDone);
    if($("planTotal")) $("planTotal").textContent = String(state.plan.length);
  }

  function renderAll(){
    renderSyllabus();
    renderPlan();
    renderDashboard();
  }

  function bindControls(){
    $("loadFileBtn")?.addEventListener("click", async () => {
      const file = $("fileInput")?.files?.[0];
      if(!file){ alert("Choose a .md file."); return; }
      if(!file.name.toLowerCase().endsWith(".md")){ alert("Only .md supported."); return; }
      const text = await file.text();
      if($("syllabusText")) $("syllabusText").value = text;
      state.syllabus = parseMarkdown(text);
      saveState();
      renderAll();
      log("Loaded .md and parsed successfully.");
    });

    $("parseTextBtn")?.addEventListener("click", () => {
      const text = ($("syllabusText")?.value || "").trim();
      if(!text){ alert("Paste syllabus text first."); return; }
      state.syllabus = parseMarkdown(text);
      saveState();
      renderAll();
      log("Parsed pasted text successfully.");
    });

    $("searchInput")?.addEventListener("input", renderSyllabus);

    $("expandBtn")?.addEventListener("click", () => {
      state.syllabus.forEach(s=>s.expanded=true);
      saveState(); renderSyllabus();
    });

    $("collapseBtn")?.addEventListener("click", () => {
      state.syllabus.forEach(s=>s.expanded=false);
      saveState(); renderSyllabus();
    });

    $("addTaskBtn")?.addEventListener("click", () => {
      const text = ($("taskText")?.value || "").trim();
      const type = $("taskType")?.value || "Daily";
      if(!text) return;
      state.plan.push({ id: uid(), text, type, done:false });
      $("taskText").value = "";
      saveState(); renderPlan(); renderDashboard();
    });

    $("resetProgressBtn")?.addEventListener("click", () => {
      if(!confirm("Reset syllabus progress?")) return;
      state.syllabus.forEach(s=>s.topics.forEach(t=>{
        t.done=false; t.subtopics.forEach(st=>st.done=false);
      }));
      saveState(); renderAll();
    });

    $("resetPlanBtn")?.addEventListener("click", () => {
      if(!confirm("Reset study plan?")) return;
      state.plan = defaultState().plan;
      saveState(); renderAll();
    });

    $("resetAllBtn")?.addEventListener("click", () => {
      if(!confirm("Reset all data?")) return;
      state = defaultState();
      saveState(); renderAll();
    });

    $("exportBtn")?.addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "upsc-debug-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    $("importBtn")?.addEventListener("click", async () => {
      const file = $("importInput")?.files?.[0];
      if(!file){ alert("Choose JSON file."); return; }
      try{
        const parsed = JSON.parse(await file.text());
        if(!parsed || !Array.isArray(parsed.syllabus) || !Array.isArray(parsed.plan)) throw new Error("invalid schema");
        state = parsed;
        saveState();
        renderAll();
        log("Imported JSON successfully.");
      }catch{
        alert("Invalid JSON.");
      }
    });
  }

  // Boot
  renderNav();
  bindControls();
  renderAll();
  log("Boot complete. App initialized.", "ok");
})();
</script>
</body>
</html>
